name: Deploy to Production

# Real, automated build -> test -> scan -> push -> deploy -> verify pipeline
# for AWS production. Only the `deploy`/`verify`/`rollback-on-failure` jobs
# ever touch AWS, and only on a genuine push to main (never a PR, never a
# fork) - see infra/terraform/cicd.tf's OIDC trust policy, which enforces
# the same restriction independently at the AWS side (a stolen/forged
# workflow run from any other ref cannot assume the deploy role even if
# this YAML were somehow bypassed).
#
# container-build-scan-push builds and Trivy-scans every image on EVERY
# push and PR (so a broken/vulnerable image is caught before merge), but
# only pushes to ECR after a real merge to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for AWS OIDC - no long-lived AWS keys anywhere in this repo

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: "113058466902.dkr.ecr.ap-south-1.amazonaws.com"

jobs:
  dependency-scan:
    name: Backend dependency security scan (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # failBuildOnCVSS=9 (backend/pom.xml) means this step's own exit code
      # is the real gate - a genuine, un-suppressed Critical finding fails
      # the job. Suppressions are reviewed individually in
      # dependency-check-suppressions.xml, never blanket.
      - name: Run OWASP dependency-check (aggregate, whole reactor)
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  container-build-scan-push:
    name: Build + scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
          - name: ai-service
            dockerfile: ai-service/Dockerfile
            context: ai-service
          - name: keycloak
            dockerfile: infra/keycloak/Dockerfile
            context: .
          - name: gateway
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-gateway
          - name: alerts
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-alerts
          - name: log-service
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-log-service
          - name: correlation
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-correlation
          - name: ingestion
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-ingestion
          - name: soar
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-soar
          - name: asset-service
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-asset-service
          - name: platform-admin
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-platform-admin
          - name: threat-service
            dockerfile: infra/docker/Dockerfile.backend
            context: .
            build_arg: acis-threat-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg && format('SERVICE={0}', matrix.build_arg) || '' }}
          push: false
          load: true
          tags: acis/${{ matrix.name }}:${{ github.sha }}

      # Fails the job on any CRITICAL finding with a known fix - matches
      # this project's real, investigated Critical=0 target (see the
      # production readiness report for the handful of findings
      # deliberately accepted with documented, non-blanket justification;
      # those are the ones with FixedVersion=none, which --ignore-unfixed
      # correctly leaves un-actionable here rather than blocking every
      # build on an upstream gap this Dockerfile cannot close).
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: acis/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan (full report, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: acis/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: json
          output: trivy-${{ matrix.name }}.json
          exit-code: "0"

      - name: Publish scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: ignore

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag "acis/${{ matrix.name }}:${{ github.sha }}" "$ECR_REGISTRY/acis/${{ matrix.name }}:${{ github.sha }}"
          docker push "$ECR_REGISTRY/acis/${{ matrix.name }}:${{ github.sha }}"

  deploy:
    name: Deploy to AWS production
    runs-on: ubuntu-latest
    needs: [container-build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    outputs:
      command_id: ${{ steps.trigger.outputs.command_id }}
      instance_id: ${{ steps.trigger.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate ECR-mode docker-compose.aws.yml
        run: python infra/scripts/generate-aws-compose.py
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}

      - name: Package config tree (no source needed - images already in ECR)
        run: |
          mkdir -p /tmp/deploy-tree
          git archive HEAD | tar -x -C /tmp/deploy-tree
          cp docker-compose.aws.yml /tmp/deploy-tree/docker-compose.aws.yml
          tar -czf /tmp/repo.tar.gz -C /tmp/deploy-tree .

      - name: Upload deploy artifacts to S3
        run: |
          aws s3 cp /tmp/repo.tar.gz "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/repo.tar.gz" --region "$AWS_REGION"
          aws s3 cp docker-compose.aws.yml "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/docker-compose.aws.yml" --region "$AWS_REGION"
          aws s3 cp infra/scripts/aws-remote-deploy-ecr.sh "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh" --region "$AWS_REGION"

      - name: Trigger deploy via SSM
        id: trigger
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "acis-cicd-deploy-${{ github.sha }}" \
            --timeout-seconds 3600 \
            --parameters "commands=[\"set -e\", \"aws s3 cp s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh /tmp/aws-remote-deploy-ecr.sh --region $AWS_REGION\", \"chmod +x /tmp/aws-remote-deploy-ecr.sh\", \"S3_BUCKET=${{ vars.S3_DEPLOY_BUCKET }} SECRET_ARN='${{ vars.SECRETS_MANAGER_SECRET_ARN }}' RDS_ADDRESS=${{ vars.RDS_ADDRESS }} REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=${{ github.sha }} /tmp/aws-remote-deploy-ecr.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "instance_id=${{ vars.APP_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
          echo "Deploy triggered: $COMMAND_ID"

      - name: Wait for deploy to complete
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "${{ steps.trigger.outputs.command_id }}" \
              --instance-id "${{ vars.APP_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Deploy status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && { echo "Deploy failed"; exit 1; }
            sleep 30
          done
          echo "Deploy did not complete within the wait window"
          exit 1

      - name: Show deploy output
        if: always()
        run: |
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "${{ steps.trigger.outputs.command_id }}" \
            --instance-id "${{ vars.APP_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text | tail -60
          echo "--- stderr ---"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "${{ steps.trigger.outputs.command_id }}" \
            --instance-id "${{ vars.APP_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text | tail -60

  verify:
    name: Health check + smoke test + E2E
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ALB target groups to report healthy
        run: |
          for tg in "${{ vars.ALB_FRONTEND_TG_ARN }}" "${{ vars.ALB_KEYCLOAK_TG_ARN }}" "${{ vars.ALB_GRAFANA_TG_ARN }}"; do
            for i in $(seq 1 20); do
              STATE=$(aws elbv2 describe-target-health --region "$AWS_REGION" --target-group-arn "$tg" --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
              echo "$tg -> $STATE"
              [ "$STATE" = "healthy" ] && break
              sleep 15
            done
            [ "$STATE" = "healthy" ] || { echo "Target group never became healthy: $tg"; exit 1; }
          done

      - name: Production smoke test (DNS, HTTPS, redirect)
        run: |
          set -e
          echo "HTTP -> HTTPS redirect:"
          curl -sI --max-time 10 http://acis.netcradus.com/ | grep -i "^HTTP/" | grep -q "301"
          echo "HTTPS real response:"
          curl -sf --max-time 10 https://acis.netcradus.com/ -o /dev/null
          echo "Keycloak admin console still blocked:"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://acis.netcradus.com:8443/admin/)
          [ "$CODE" = "403" ] || { echo "Admin console not blocked (got $CODE)"; exit 1; }
          echo "Keycloak realm/OIDC reachable:"
          curl -sf --max-time 10 https://acis.netcradus.com:8443/realms/acis/.well-known/openid-configuration -o /dev/null
          echo "All smoke checks passed."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Real production E2E (login, invalid login, RBAC)
        working-directory: frontend
        env:
          SMOKE_ADMIN_PASS: ${{ secrets.SMOKE_TEST_ADMIN_PASSWORD }}
          SMOKE_ANALYST_PASS: ${{ secrets.SMOKE_TEST_ANALYST_PASSWORD }}
        run: npx playwright test --config=e2e-prod/playwright.config.cjs --reporter=line

  rollback-on-failure:
    name: Automatic rollback
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find previous known-good image tag
        id: prev
        run: |
          PREV_TAG=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["tail -n 2 /opt/acis/deploy-history.log | head -n 1 | awk \"{print \\$3}\""]' \
            --query "Command.CommandId" --output text)
          sleep 10
          TAG=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$PREV_TAG" --instance-ids "${{ vars.APP_INSTANCE_ID }}" --query "StandardOutputContent" --output text | tr -d '[:space:]')
          echo "previous_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rolling back to: $TAG"

      - name: Redeploy previous tag (pull-based, no rebuild)
        run: |
          aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "acis-cicd-rollback" \
            --timeout-seconds 1800 \
            --parameters "commands=[\"set -e\", \"aws s3 cp s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh /tmp/aws-remote-deploy-ecr.sh --region $AWS_REGION\", \"chmod +x /tmp/aws-remote-deploy-ecr.sh\", \"S3_BUCKET=${{ vars.S3_DEPLOY_BUCKET }} SECRET_ARN='${{ vars.SECRETS_MANAGER_SECRET_ARN }}' RDS_ADDRESS=${{ vars.RDS_ADDRESS }} REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=${{ steps.prev.outputs.previous_tag }} /tmp/aws-remote-deploy-ecr.sh\"]" \
            --query "Command.CommandId" --output text
