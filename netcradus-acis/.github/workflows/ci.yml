name: CI

# Real build+test pipeline - previously none existed anywhere in this repo
# (added during the production-readiness audit). Runs on every push/PR to
# main so a broken build/test/lint is caught before merge, not discovered
# manually at deploy time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        working-directory: backend
        run: mvn -B clean install -DskipTests

      - name: Run tests
        working-directory: backend
        run: mvn -B test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/*/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Dependency vulnerability audit (informational)
        run: npm audit --audit-level=critical || true

  docker-build-check:
    name: Docker images build cleanly
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service:
          - acis-gateway
          - acis-log-service
          - acis-alerts
          - acis-correlation
          - acis-ingestion
          - acis-soar
          - acis-asset-service
          - acis-platform-admin
          - acis-threat-service
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false

  frontend-docker-build-check:
    name: Frontend Docker image builds cleanly
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
