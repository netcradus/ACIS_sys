# NETCRADUS ACIS — Production Docker Compose (single VM)
#
# Required secrets are read from a `.env` file next to this compose file
# (already covered by .gitignore — never commit it). Copy .env.prod.example
# to .env and fill in real values before running:
#
#   cp .env.prod.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy (below) is the only thing published to the host — ports 80/443 (app)
# and 8443 (Keycloak). It terminates TLS for both, automatically obtaining
# and renewing a real Let's Encrypt certificate for PUBLIC_APP_DOMAIN once
# that's a real hostname whose DNS points at this host. Until then it
# defaults to "localhost", serving locally-trusted HTTPS via Caddy's internal
# CA — enough to verify the whole proxy chain before you own a domain.
# Postgres, Kafka, Elasticsearch, the gateway, every backend microservice,
# and the AI service are reachable only on the internal Docker network — the
# frontend's nginx proxies /api and /ws to the gateway (see
# infra/docker/nginx.conf.template).
#
# Production does NOT auto-import the demo realm (see keycloak service
# below) — that realm ships seeded demo users (admin/analyst1/analyst2)
# meant for local dev only. Configure real tenants/users via the admin
# console (https://<PUBLIC_APP_DOMAIN>:8443) once the stack is up, or mount
# your own reviewed realm export.

services:
  # 0. TLS termination + reverse proxy — the only service published to the host.
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_APP_DOMAIN: ${PUBLIC_APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (required for Let's Encrypt registration)}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - keycloak
    restart: always

  # 1. ACIS Web Frontend (nginx, proxies /api + /ws to the gateway) — internal only, fronted by Caddy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_KEYCLOAK_URL: https://${PUBLIC_APP_DOMAIN:-localhost}:8443
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
        VITE_KEYCLOAK_CLIENT_ID: acis-frontend
    environment:
      GATEWAY_UPSTREAM: http://gateway:8080
    expose:
      - "80"
    restart: always
    depends_on:
      - gateway

  # 2. ACIS AI Intelligence Service (Python FastAPI) — internal only
  # KIRO_GATEWAY_URL is empty by default — /ai/explain and /ai/query run in
  # honest mock mode (tagged X-ACIS-AI-Mode: mock) until you both set it AND
  # start the optional kiro-gateway service below.
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      # Real AI providers only (see ai-service/app/providers.py) — every
      # LLM-backed feature tries these in order and stops at the first one
      # that's configured and succeeds. If none are configured, or every
      # configured one fails, the feature returns a real "AI unavailable"
      # error. There is no mock/fake fallback in this deployment.
      #
      # Primary — NVIDIA NIM. Tried first, and the only backend
      # /ai/explain/stream streams token-by-token from unless it fails
      # before yielding anything.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      # Real fallback #1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # Real fallback #2
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Real fallback #3
      KIRO_GATEWAY_URL: ${KIRO_GATEWAY_URL:-}
      KIRO_GATEWAY_API_KEY: ${KIRO_GATEWAY_API_KEY:-}
      KIRO_MODEL: ${KIRO_MODEL:-claude-sonnet-4-5}
      # Real IOC enrichment (EnrichIoc gRPC) — optional; without these,
      # enrichment returns an explicit "unconfigured" result, never fake data.
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    expose:
      - "8090"
      - "50051"
    restart: always

  # 2b. OPTIONAL — Kiro Gateway (unofficial, community-maintained proxy —
  # see project notes on the ToS/stability risk before enabling this).
  # Disabled unless you explicitly opt in:
  #   docker compose -f docker-compose.prod.yml --profile kiro up -d --build
  # Requires a Kiro Desktop Auth JSON file dropped at
  # ./secrets/kiro-auth-token.json (gitignored — never commit it).
  kiro-gateway:
    image: ghcr.io/jwadow/kiro-gateway:latest
    profiles: ["kiro"]
    environment:
      # NOTE: intentionally NOT a required (${VAR:?...}) variable — Compose
      # interpolates every service's variables up front regardless of which
      # profiles are active, so a hard requirement here would break the
      # default (no --profile kiro) deploy too. Set KIRO_GATEWAY_API_KEY in
      # .env yourself before running with --profile kiro; if you forget,
      # this container just won't authenticate anything, not the whole stack.
      PROXY_API_KEY: ${KIRO_GATEWAY_API_KEY:-}
      KIRO_CREDS_FILE: /home/kiro/.aws/sso/cache/kiro-auth-token.json
    volumes:
      - ./secrets/kiro-auth-token.json:/home/kiro/.aws/sso/cache/kiro-auth-token.json:ro
    expose:
      - "8000"
    restart: unless-stopped

  # 3. PostgreSQL Database — internal only
  # POSTGRES_USER ("acis") is the bootstrap/admin role — Postgres always makes
  # this role a superuser, and Row Level Security NEVER applies to
  # superusers. So every acis-* service instead connects as "acis_app", an
  # ordinary role created by infra/postgres-init/01-create-app-role.sh on
  # first boot (only runs against a fresh/empty volume — see that script for
  # migrating an existing one). DB_PASSWORD below is acis_app's password.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-acis}
      POSTGRES_USER: acis
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # 4. Keycloak Identity Provider — production mode, Postgres-backed, TLS
  # terminated at Caddy (:8443 -> here over plain HTTP internally).
  # `start` (not `start-dev`) + `--hostname-strict` (default true) means
  # Keycloak trusts only PUBLIC_APP_DOMAIN as its issuer/frontend URL — this
  # is what makes the token `iss` claim consistent regardless of which
  # internal service validates it (see backend application.yml jwk-set-uri).
  keycloak:
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    command: >
      start
      --hostname=${PUBLIC_APP_DOMAIN:-localhost}
      --hostname-port=8443
      --http-enabled=true
      --proxy-headers=xforwarded
      --db=postgres
      --db-url-host=postgres
      --db-url-database=keycloak
      --db-username=keycloak
      --db-password=${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env — do not reuse the dev default}
    volumes:
      - ./infra/keycloak/themes/acis:/opt/keycloak/themes/acis
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: always

  # 5. Kafka Event Broker — internal only
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    # cp-kafka doesn't run a real init as PID 1, so subprocesses spawned by
    # the healthcheck below (a fresh `kafka-topics` JVM every 15s) that
    # don't exit cleanly get orphaned onto the broker process itself, which
    # never reaps them — they accumulate as zombies indefinitely. `init:
    # true` injects Docker's built-in tini as PID 1 so orphans get reaped
    # properly. Purely a process-supervision fix — no effect on Kafka itself.
    init: true
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: YWNpcy1sb2ctY2x1c3Rlcg==
    expose:
      - "29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  # 6. Elasticsearch — internal only
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ---- Backend microservices — all internal only, reached via the gateway ----

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-gateway
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_APP_DOMAIN:-localhost}
      LOG_SERVICE_URL: http://log-service:8082
      ALERTS_SERVICE_URL: http://alerts:8081
      CORRELATION_SERVICE_URL: http://correlation:8083
      SOAR_SERVICE_URL: http://soar:8085
      INGESTION_SERVICE_URL: http://ingestion:8084
      ASSET_SERVICE_URL: http://asset-service:8086
      THREAT_SERVICE_URL: http://threat-service:8087
      PLATFORM_ADMIN_SERVICE_URL: http://platform-admin:8088
    expose:
      - "8080"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: always

  alerts:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-alerts
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      AI_SERVICE_URL: http://ai-service:8090
      # Shared secret real internal service-to-service callers (no end-user
      # JWT) attach as X-Internal-Service-Key — see
      # InternalServiceKeyMatcher/RbacEnforcementFilter. Must be identical
      # across every backend service in this file.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  log-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-log-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ES_HOST: http://elasticsearch:9200
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      AI_SERVICE_URL: http://ai-service:8090
      # Synthetic demo log generator — leave unset/false in real deployments;
      # it exists only to populate the log explorer before real log sources
      # (syslog/agents/cloud log forwarders) are wired into acis-ingestion.
      MOCK_LOG_GENERATOR_ENABLED: ${MOCK_LOG_GENERATOR_ENABLED:-false}
      # Added for real RBAC enforcement (RbacEnforcementFilter reads the
      # shared user_members/console_roles/role_permissions tables). This
      # service's actual log data still lives entirely in Elasticsearch.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  correlation:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-correlation
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
    expose:
      - "8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  ingestion:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      # Added for /api/ingest/external/** — ApiKeyAuthFilter looks up API keys
      # in Postgres (api_keys table, owned by the soar service). This service
      # previously had no datasource at all; without these it falls back to
      # localhost, which inside this container is itself, not the postgres
      # service, and it would crash-loop on startup.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "8084"
    # Real per-tenant syslog/CEF listener ports (see SyslogListenerService) —
    # must be actually published (not just exposed) for external firewalls/
    # routers to reach them. Range must match acis-soar's syslog.port-range-*
    # config (SYSLOG_PORT_RANGE_START/END), since that's what allocates them.
    ports:
      - "20514-20563:20514-20563/udp"
      - "20514-20563:20514-20563/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  soar:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-soar
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      ASSET_SERVICE_URL: http://asset-service:8086
      INGESTION_SERVICE_URL: http://ingestion:8084
      # Real cross-service call so the integration poller's GuardDuty/Azure
      # AD findings also land in the Threat Intelligence indicator list —
      # see IntegrationPollerService.forwardIndicators.
      THREAT_SERVICE_URL: http://threat-service:8087
      # Shared secret real internal service-to-service callers (no end-user
      # JWT) attach as X-Internal-Service-Key — see
      # InternalServiceKeyMatcher/RbacEnforcementFilter. Must be identical
      # across every backend service in this file.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env, generated via openssl rand -base64 32}
      # Real Keycloak account provisioning on invite-accept (see
      # KeycloakAdminConfig / InvitationService) — same acis-backend service
      # account platform-admin already uses, reused here rather than
      # provisioning a second Keycloak client.
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?Set KEYCLOAK_BACKEND_CLIENT_SECRET in .env}
      # Real SMTP for invitation emails (see EmailService) — Zoho Mail in
      # production. No default: an unset SMTP_PASSWORD means invites still
      # get created (and their real accept link still works if handed over
      # manually) but the email genuinely won't send — EmailService logs
      # that honestly rather than pretending it worked.
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_SSL: ${SMTP_SSL:-true}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-info@netcradus.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ACIS Security}
      # Where the invitation email's accept link points — the tenant
      # console's real public origin, not the API gateway.
      FRONTEND_URL: https://${PUBLIC_APP_DOMAIN:-localhost}
    expose:
      - "8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ingestion:
        condition: service_started
    restart: always

  asset-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-asset-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      # Real cross-service call for the self-healing drift detector — see
      # AssetDriftDetectionService, same RestTemplate + X-Tenant-ID pattern
      # ComplianceService already uses to call acis-asset-service.
      ALERTS_SERVICE_URL: http://alerts:8081
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
    expose:
      - "8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  platform-admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-platform-admin
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      # Without this, application.yml's own fallback silently uses the
      # guessable literal "acis-backend-secret" (VAPT finding C-02) — this
      # is the only thing that makes the real rotated secret actually reach
      # the service that authenticates with it via client_credentials.
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?Set KEYCLOAK_BACKEND_CLIENT_SECRET in .env}
      # Suppresses TenantSeeder's fake "Acme Corp (Demo)" row, which — with
      # no profile active — otherwise seeds identically here as in local
      # dev, showing up in the real platform-wide Tenants list next to
      # actual customers.
      SPRING_PROFILES_ACTIVE: prod
      # Real SMTP for the tenant-onboarding activation email a Platform
      # Admin's "New Tenant" action sends (see TenantActivationService) —
      # same Zoho Mail account acis-soar's invitations already use.
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_SSL: ${SMTP_SSL:-true}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-info@netcradus.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ACIS Security}
      # Where the activation email's link points — the tenant console's
      # real public origin, not the API gateway.
      FRONTEND_URL: https://${PUBLIC_APP_DOMAIN:-localhost}
    expose:
      - "8088"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always

  threat-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        SERVICE: acis-threat-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-acis}
      DB_USER: acis_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-acis}
      AI_SERVICE_GRPC_HOST: ai-service
      AI_SERVICE_GRPC_PORT: "50051"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env, generated via openssl rand -base64 32}
    expose:
      - "8087"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  es_data:
  kafka_data:
  caddy_data:
  caddy_config:
