# Real Alertmanager routing — grouped and rate-limited so a cascading
# failure (e.g. Postgres going down, which trips PostgresDown +
# HikariPoolNearExhaustion + ServiceDown for every backend at once) sends
# ONE grouped notification, not a dozen separate pages.
#
# IMPORTANT: unlike docker-compose.yml or nginx's templating, Alertmanager's
# own config file has NO environment-variable interpolation - `${VAR}`
# syntax here would be sent to a receiver literally, not substituted. This
# file must be edited directly (not via .env) to point `webhook_configs.url`
# / add real `email_configs`/`slack_configs` at your actual notification
# channel before relying on it. Until edited, alerts still evaluate
# correctly and are visible in Alertmanager's own UI (see MONITORING.md) -
# they just have nowhere external to be delivered.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  # No receiver configured out of the box (deliberately, rather than a
  # fake/dead webhook URL) - alerts fire and are visible in the Alertmanager
  # UI regardless; add a real receiver below to also get pushed
  # notifications. Examples (uncomment and fill in real values):
  #
  # webhook_configs:
  #   - url: 'https://your-real-webhook-endpoint'
  #     send_resolved: true
  #
  # slack_configs:
  #   - api_url: 'https://hooks.slack.com/services/REAL/WEBHOOK/URL'
  #     channel: '#acis-alerts'
  #     send_resolved: true
  #
  # email_configs:
  #   - to: 'oncall@yourcompany.com'
  #     from: 'alerts@yourcompany.com'
  #     smarthost: 'smtp.yourprovider.com:587'
  #     auth_username: 'alerts@yourcompany.com'
  #     auth_password: 'REAL_SMTP_PASSWORD'
  - name: 'default'

  - name: 'critical'

inhibit_rules:
  # If Postgres itself is down, suppress the pool-exhaustion/service-down
  # alerts that are a direct, expected consequence of that same root cause -
  # one root-cause alert, not a storm of derivative ones.
  - source_match:
      alertname: 'PostgresDown'
    target_match_re:
      alertname: 'HikariPool.*|ServiceDown'
    equal: []
