server:
  port: 8080

spring:
  application:
    name: acis-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

  cloud:

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # Standard downstream routes
      routes:
        - id: log-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/logs/**,/ws/logs/**

        - id: alerts
          uri: http://localhost:8081
          predicates:
            - Path=/api/alerts/**,/api/dashboard/**,/ws/alerts/**

        - id: search
          uri: http://localhost:8082
          predicates:
            - Path=/api/search/**

        - id: correlation
          uri: http://localhost:8083
          predicates:
            - Path=/api/correlation/**

        - id: soar
          uri: http://localhost:8085
          predicates:
            - Path=/api/soar/**,/api/red-team/**,/api/compliance/**

        - id: ingestion
          uri: http://localhost:8084
          predicates:
            - Path=/api/ingest/**

        - id: assets
          uri: http://localhost:8086
          predicates:
            - Path=/api/assets/**

        - id: threat-intel
          uri: http://localhost:8087
          predicates:
            - Path=/api/threat-intel/**

        - id: reports
          uri: http://localhost:8088
          predicates:
            - Path=/api/reports/**




# Actuator — expose health and prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    com.netcradus.acis: DEBUG
