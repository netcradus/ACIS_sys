server:
  port: 8080

spring:
  application:
    name: acis-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

  cloud:

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # Standard downstream routes — each URI defaults to the local dev port but
      # is overridden by *_SERVICE_URL env vars to the container/service DNS name
      # in docker-compose / Kubernetes.
      routes:
        - id: log-service
          uri: ${LOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/logs/**,/ws/logs/**

        - id: alerts
          uri: ${ALERTS_SERVICE_URL:http://localhost:8081}
          predicates:
            # /api/incidents/** is the real Incidents feature (IncidentController), same service as Alerts.
            - Path=/api/alerts/**,/ws/alerts/**,/api/incidents/**

        - id: correlation
          uri: ${CORRELATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/correlation/**

        - id: soar
          uri: ${SOAR_SERVICE_URL:http://localhost:8085}
          predicates:
            # /api/invitations/** is the public accept-invite flow
            # (InvitationController, same service) and /api/agent/** is the
            # public heartbeat/install-script surface (AgentController) — see
            # SecurityConfig's permitAll for why both are reachable without a JWT.
            - Path=/api/soar/**,/api/red-team/**,/api/compliance/**,/api/invitations/**,/api/agent/**

        - id: ingestion
          uri: ${INGESTION_SERVICE_URL:http://localhost:8084}
          predicates:
            # /services/collector/** is the real Splunk HEC wire path (see
            # SplunkHecController) — same downstream service as /api/ingest/**.
            - Path=/api/ingest/**,/services/collector/**

        - id: assets
          uri: ${ASSET_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/assets/**

        - id: threat-intel
          uri: ${THREAT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/threat-intel/**

        - id: platform-admin
          uri: ${PLATFORM_ADMIN_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/platform/**

# Actuator — expose health and prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    com.netcradus.acis: DEBUG
