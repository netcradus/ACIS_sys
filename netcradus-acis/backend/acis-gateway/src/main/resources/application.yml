server:
  port: 8080

spring:
  application:
    name: acis-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

  cloud:

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # Standard downstream routes — each URI defaults to the local dev port but
      # is overridden by *_SERVICE_URL env vars to the container/service DNS name
      # in docker-compose / Kubernetes.
      routes:
        - id: log-service
          uri: ${LOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/logs/**,/ws/logs/**

        - id: alerts
          uri: ${ALERTS_SERVICE_URL:http://localhost:8081}
          predicates:
            # /api/incidents/** is the real Incidents feature (IncidentController), same service as Alerts.
            - Path=/api/alerts/**,/ws/alerts/**,/api/incidents/**

        - id: correlation
          uri: ${CORRELATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/correlation/**

        - id: soar
          uri: ${SOAR_SERVICE_URL:http://localhost:8085}
          predicates:
            # /api/invitations/** is the public accept-invite flow
            # (InvitationController, same service) and /api/agent/** is the
            # public heartbeat/install-script surface (AgentController) — see
            # SecurityConfig's permitAll for why both are reachable without a JWT.
            - Path=/api/soar/**,/api/red-team/**,/api/compliance/**,/api/invitations/**,/api/agent/**

        - id: ingestion
          uri: ${INGESTION_SERVICE_URL:http://localhost:8084}
          predicates:
            # /services/collector/** is the real Splunk HEC wire path (see
            # SplunkHecController) — same downstream service as /api/ingest/**.
            - Path=/api/ingest/**,/services/collector/**

        - id: assets
          uri: ${ASSET_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/assets/**

        - id: threat-intel
          uri: ${THREAT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/threat-intel/**

        - id: platform-admin
          uri: ${PLATFORM_ADMIN_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/platform/**

acis:
  internal-service-key: ${INTERNAL_SERVICE_KEY:local-dev-internal-key}
  # Number of reverse-proxy hops in front of this gateway that are trusted to
  # append their own view of the client IP to X-Forwarded-For (Caddy + nginx
  # in prod = 2). Defaults to 0 (ignore X-Forwarded-For entirely, use the raw
  # TCP peer) so an unconfigured deployment can never trust a client-spoofed
  # header - see RateLimiterFilter/PreAuthRateLimiterFilter.resolveIp.
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
  waf:
    soar-service-url: ${SOAR_SERVICE_URL:http://localhost:8085}
    policy-poll-interval-ms: ${WAF_POLICY_POLL_INTERVAL_MS:30000}

# Actuator — expose health and prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    com.netcradus.acis: DEBUG
