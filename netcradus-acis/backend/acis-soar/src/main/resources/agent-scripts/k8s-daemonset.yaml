apiVersion: v1
kind: Secret
metadata:
  name: acis-agent-token
  namespace: acis-security
type: Opaque
stringData:
  token: "__ENROLLMENT_TOKEN__"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: acis-agent
  namespace: acis-security
  labels:
    app: acis-agent
spec:
  selector:
    matchLabels:
      app: acis-agent
  template:
    metadata:
      labels:
        app: acis-agent
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: acis-agent
          image: curlimages/curl:8.9.1
          env:
            - name: ACIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: acis-agent-token
                  key: token
            - name: ACIS_SERVER
              value: "__SERVER_URL__"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              AGENT_ID="k8s-$(cat /etc/machine-id 2>/dev/null || echo $NODE_NAME)"
              while true; do
                curl -sS -X POST "$ACIS_SERVER/api/agent/heartbeat" \
                  -H "Content-Type: application/json" \
                  -H "X-Agent-Token: $ACIS_TOKEN" \
                  -d "{\"agentId\":\"$AGENT_ID\",\"hostname\":\"$NODE_NAME\",\"os\":\"Kubernetes Node\",\"ipAddress\":\"\",\"agentVersion\":\"acis-heartbeat-k8s-1.0\"}" \
                  --max-time 15 >/dev/null 2>&1 || true
                sleep 60
              done
