server:
  port: 8085

spring:
  application:
    name: acis-soar
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    # acis_app (not the "acis" bootstrap superuser) — Row Level Security never
    # applies to superusers, so the app must connect as an ordinary role.
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: acis-soar-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # acis-soar's only consumer is AuditEventConsumer, so a single default
        # type is safe — publishers don't need to be on the same classpath /
        # exact package layout as this service for deserialization to work.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.netcradus.acis.common.audit.AuditEvent
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs
  # Real SMTP for invitation emails (see EmailService). Deliberately no
  # default username/password — this is a real mailbox, not a locally-safe
  # dev default like DB_PASSWORD. Left unset, EmailService logs a clear
  # warning and skips sending rather than pretending it worked; the invite
  # itself (and its real accept link) still gets created either way, so an
  # admin can hand the link over manually if SMTP isn't configured yet.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SMTP_SSL:true}
          connectiontimeout: 8000
          timeout: 8000

# Keycloak Admin REST — see KeycloakAdminConfig / InvitationService. Reuses
# the same acis-backend service account acis-platform-admin already
# authenticates as (already granted manage-users/view-users).
acis:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:acis}
    admin-client-id: acis-backend
    # "acis-backend-secret" is a LOCAL-DEV-ONLY value - it's the literal
    # secret baked into infra/keycloak/realm-acis.json's dev realm import, so
    # it's already public/non-sensitive in that context. docker-compose.prod.yml
    # requires KEYCLOAK_BACKEND_CLIENT_SECRET with no fallback
    # (${VAR:?Set...}), so this default can never silently activate in the
    # documented prod deployment path - but if this jar is ever run outside
    # that compose file (bare java -jar, a different orchestrator) without
    # setting the env var, it WOULD activate. Rotate the real Keycloak client
    # secret if that ever happens.
    admin-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:acis-backend-secret}
  # Shared secret real internal service-to-service callers (no end-user JWT
  # to present — ComplianceService.fetchAssetManagementSignal,
  # IntegrationPollerService.forwardIndicators) attach as
  # X-Internal-Service-Key — see InternalServiceKeyMatcher/
  # RbacEnforcementFilter. Must be identical across every backend service.
  internal-service-key: ${INTERNAL_SERVICE_KEY:local-dev-internal-key}
  mail:
    from-email: ${MAIL_FROM_EMAIL:info@netcradus.com}
    from-name: ${MAIL_FROM_NAME:ACIS Security}
  # Where the invitation email's accept link points — must be the real
  # tenant-console frontend origin, not the API gateway.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  asset-service:
    url: ${ASSET_SERVICE_URL:http://localhost:8086}
  ingestion-service:
    url: ${INGESTION_SERVICE_URL:http://localhost:8084}
  # Real cross-service call so GuardDuty/Azure AD findings the integration
  # poller pulls also land in the Threat Intelligence indicator list, not
  # just the Alerts pipeline — see IntegrationPollerService.forwardIndicators.
  threat-service:
    url: ${THREAT_SERVICE_URL:http://localhost:8087}
  # How often IntegrationPollerService pulls Palo Alto/Wazuh/SentinelOne —
  # real vendor API/firewall calls, so this is deliberately not sub-minute.
  integration-poll-interval-ms: ${INTEGRATION_POLL_INTERVAL_MS:120000}
  integration-poll-initial-delay-ms: ${INTEGRATION_POLL_INITIAL_DELAY_MS:30000}
  # Real UDP/TCP ports handed out one-per-tenant for raw syslog/CEF ingestion
  # (see SyslogSourceController + acis-ingestion's SyslogListenerService).
  # This whole range must be published on the ingestion container in
  # docker-compose (both /udp and /tcp) for external devices to reach it.
  syslog:
    port-range-start: ${SYSLOG_PORT_RANGE_START:20514}
    port-range-end: ${SYSLOG_PORT_RANGE_END:20563}
  # AES-256 key (base64, 32 raw bytes) for encrypting third-party credentials
  # at rest (e.g. a tenant's Cloudflare API token — see CredentialEncryptor).
  # The dev default below is fine for local dev only; production MUST set
  # CREDENTIAL_ENCRYPTION_KEY in .env to a real random key (e.g.
  # `openssl rand -base64 32`) — losing/rotating it makes every credential
  # stored under the old key permanently undecryptable, so this is
  # deliberately not auto-generated at startup.
  credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:VWSEY4S3eOYE3D49h4f4iM+Sh8vLeD8M8QWPJwcHToA=}
  # Real self-hosted ClamAV daemon (see FileScanService/ClamAvClient) - the
  # docker-compose "clamav" service, INSTREAM protocol over plain TCP.
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  # Where scanned/quarantined file bytes are written - randomized,
  # extensionless filenames only (see FileScanService.writeToDisk).
  file-storage:
    base-dir: ${FILE_STORAGE_BASE_DIR:./file-storage}

logging:
  level:
    com.netcradus.acis.soar: DEBUG
