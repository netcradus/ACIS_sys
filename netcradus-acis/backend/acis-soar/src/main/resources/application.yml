server:
  port: 8085

spring:
  application:
    name: acis-soar
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    # acis_app (not the "acis" bootstrap superuser) — Row Level Security never
    # applies to superusers, so the app must connect as an ordinary role.
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: acis-soar-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # acis-soar's only consumer is AuditEventConsumer, so a single default
        # type is safe — publishers don't need to be on the same classpath /
        # exact package layout as this service for deserialization to work.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.netcradus.acis.common.audit.AuditEvent
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

acis:
  asset-service:
    url: ${ASSET_SERVICE_URL:http://localhost:8086}
  # AES-256 key (base64, 32 raw bytes) for encrypting third-party credentials
  # at rest (e.g. a tenant's Cloudflare API token — see CredentialEncryptor).
  # The dev default below is fine for local dev only; production MUST set
  # CREDENTIAL_ENCRYPTION_KEY in .env to a real random key (e.g.
  # `openssl rand -base64 32`) — losing/rotating it makes every credential
  # stored under the old key permanently undecryptable, so this is
  # deliberately not auto-generated at startup.
  credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:VWSEY4S3eOYE3D49h4f4iM+Sh8vLeD8M8QWPJwcHToA=}

logging:
  level:
    com.netcradus.acis.soar: DEBUG
