server:
  port: 8081


spring:
  application:
    name: acis-alerts
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    # acis_app (not the "acis" bootstrap superuser) — Row Level Security never
    # applies to superusers, so the app must connect as an ordinary role.
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: acis-alerts-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      # Without this, Spring Boot's auto-configured KafkaTemplate<String,Object>
      # defaults to a plain StringSerializer for values — confirmed live: every
      # real AuditEventPublisher.publish() call (ALERT_STATUS_CHANGE/UPDATE/
      # LABELED, INCIDENT_*) was silently failing ("Can't convert value of
      # class AuditEvent to class StringSerializer"), so audit_entries never
      # received a single row from this service and the real Investigation
      # Timeline had nothing to read. Matches the JsonSerializer already used
      # for this service's own consumer above.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

acis:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8090}
  # Shared secret real internal service-to-service callers (no end-user JWT
  # to present) attach as X-Internal-Service-Key — see
  # InternalServiceKeyMatcher/RbacEnforcementFilter. Must be identical
  # across every backend service.
  internal-service-key: ${INTERNAL_SERVICE_KEY:local-dev-internal-key}

# Actuator — expose health and Prometheus metrics (see infra/monitoring/prometheus.yml)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.netcradus.acis: DEBUG
