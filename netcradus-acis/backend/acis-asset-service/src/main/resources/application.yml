server:
  port: 8086


spring:
  application:
    name: acis-asset-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    # acis_app (not the "acis" bootstrap superuser) — Row Level Security never
    # applies to superusers, so the app must connect as an ordinary role.
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

acis:
  alerts-service:
    url: ${ALERTS_SERVICE_URL:http://localhost:8081}
  # How often AssetDriftDetectionService cross-checks real open CRITICAL/HIGH
  # alerts against the asset inventory — deliberately not sub-minute, this
  # is a background health sweep, not a live event handler.
  drift-detection-interval-ms: ${DRIFT_DETECTION_INTERVAL_MS:300000}

logging:
  level:
    com.netcradus.acis: DEBUG
