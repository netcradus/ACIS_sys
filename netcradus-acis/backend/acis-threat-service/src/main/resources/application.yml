server:
  port: 8087


spring:
  application:
    name: acis-threat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    # acis_app (not the "acis" bootstrap superuser) — Row Level Security never
    # applies to superusers, so the app must connect as an ordinary role.
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

logging:
  level:
    com.netcradus.acis: DEBUG

grpc:
  client:
    aiService:
      address: 'static://${AI_SERVICE_GRPC_HOST:127.0.0.1}:${AI_SERVICE_GRPC_PORT:50051}'
      negotiation-type: plaintext
