server:
  port: 8082


spring:
  application:
    name: acis-log-service

  # Only backs the shared RBAC tables (see RbacEnforcementFilter) — this
  # service's real log storage stays entirely in Elasticsearch below.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acis}?options=-c%20timezone=UTC
    username: ${DB_USER:acis_app}
    password: ${DB_PASSWORD:acis_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: acis-log-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # Without this, a message produced from a plain Map (as
        # IngestionController's /syslog, /json, /external/syslog, and
        # /external/json all do) carries a __TypeId__ header of
        # java.util.LinkedHashMap, which JsonDeserializer honors over this
        # listener's declared LogDocument parameter — the message then fails
        # to convert and is silently dropped (logged, not requeued). Ignoring
        # the header and always deserializing as LogDocument (Jackson maps
        # unknown/extra Map keys onto its fields the same way either way)
        # fixes this for every producer, not just the new ones.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.netcradus.acis.log.model.LogDocument
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ES_HOST:http://localhost:9200}
    socket-timeout: 30s


  # Security Configuration (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:acis}/protocol/openid-connect/certs

acis:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8090}
  mock-log-generator:
    # Synthetic demo log generator — off by default everywhere, including prod.
    # Only for local/demo environments with no real log sources wired up yet.
    enabled: ${MOCK_LOG_GENERATOR_ENABLED:false}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.data.elasticsearch: INFO
    org.springframework.kafka: INFO
    com.netcradus.acis: DEBUG
