<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NETCRADUS ACIS — Autonomous Cyber Immune System. AI-powered SIEM + SOAR + Self-Healing cybersecurity platform." />
    <title>NETCRADUS ACIS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Polyfill: sockjs-client and some transitive deps expect a Node.js-like
      // 'global' object. This must run synchronously BEFORE any ES module loads.
      var g = typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : typeof self !== 'undefined' ? self : {};
      if (!g.global) g.global = g;
      if (!g.process) g.process = { env: {}, version: '', platform: 'browser' };
    </script>
    <script>
      // Set data-theme before first paint so the app never flashes the wrong
      // theme. Mirrors themeStore.ts's resolution logic exactly — kept here
      // too because the store's module-level matchMedia() call happens too
      // late (after the initial HTML/CSS has already painted once).
      (function () {
        try {
          var saved = localStorage.getItem('acis_theme_mode');
          var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
