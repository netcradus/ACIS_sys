name: netcradus-acis
region: nyc
features:
  - buildpack-stack=ubuntu-22

# 1. Frontend Static Application
static_sites:
  - name: frontend
    source_dir: netcradus-acis/frontend
    build_command: npm install && npm run build
    output_dir: dist
    routes:
      - path: /
    environment_slug: node-js

# 2. AI Intelligence Service (Python FastAPI)
services:
  - name: ai-service
    source_dir: netcradus-acis/ai-service
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8090
    http_port: 8090
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api/ai
