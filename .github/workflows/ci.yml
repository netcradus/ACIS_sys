name: CI / Deploy to Production

# Real build -> test -> scan -> push -> deploy -> verify pipeline. Runs on
# every push/PR to main so a broken build/test/lint/scan is caught before
# merge; only a genuine push to main (never a PR, never a fork) reaches
# the deploy/verify/rollback-on-failure jobs - see netcradus-acis/infra/
# terraform/cicd.tf's OIDC trust policy, which enforces the same
# restriction independently at the AWS side (a forged workflow run from
# any other ref cannot assume the deploy role even if this YAML were
# somehow bypassed).
#
# All paths below are prefixed with netcradus-acis/ - that subdirectory,
# not this repo's own root, is where the actual ACIS application lives
# (this repo root holds other, unrelated legacy content alongside it).
# This file must live at the true repo root's .github/workflows/ - GitHub
# Actions does not discover workflow files nested any deeper than that,
# which is exactly why an earlier copy of this file placed under
# netcradus-acis/.github/workflows/ never actually ran (found via
# `gh api repos/.../actions/workflows` returning zero registered
# workflows despite real commits having been pushed).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Real duplicate-run collision hit on this pipeline's third run: a single
# push somehow produced two simultaneous workflow runs for the identical
# commit SHA, and the container-build-scan-push matrix jobs raced to push
# the same immutable git-SHA image tags to ECR - whichever run lost the
# race for a given service failed with "tag ... already exists ... tag is
# immutable" (real ECR error, not a flaky one - see PUSH_ECR_IDEMPOTENT
# handling below for the complementary defense-in-depth fix). This
# concurrency group cancels any older in-flight run for the same ref
# the moment a newer one starts, so only one run per branch is ever
# actually building/pushing/deploying at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC - no long-lived AWS keys anywhere in this repo

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: "113058466902.dkr.ecr.ap-south-1.amazonaws.com"
  APP_DIR: netcradus-acis

jobs:
  backend:
    name: Backend (Maven build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all modules
        working-directory: netcradus-acis/backend
        run: mvn -B clean install -DskipTests

      - name: Run tests
        working-directory: netcradus-acis/backend
        run: mvn -B test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: netcradus-acis/backend/*/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netcradus-acis/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: netcradus-acis/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Practical ruleset (.eslintrc.cjs) - unused vars, hook-rule
        # violations, undefined components, etc. Warnings (mostly
        # pre-existing `any` usage) don't fail the build; only errors do.
        run: npm run lint

      - name: Type-check
        # A real, separate step - `npm run build` (below) does NOT
        # typecheck (vite/esbuild only transpiles, it doesn't run tsc), so
        # this step existing under the name "Type-check + build" previously
        # meant type errors were never actually caught by CI. This also
        # depends on tsconfig.json's `ignoreDeprecations` being a value tsc
        # itself accepts ("5.0", not "6.0") - see tsconfig.json's history;
        # with the old, invalid value every tsc invocation failed before
        # type-checking ever started, silently masking real type errors.
        run: npx tsc --noEmit

      - name: Unit + component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit (informational)
        run: npm audit --audit-level=critical || true

  dependency-scan:
    name: Backend dependency security scan (OWASP)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compute cache week key
        id: date
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # A cold run has to download the entire NVD CVE database from
      # scratch - really took ~59 minutes on a real first run (observed,
      # not estimated), separate from and far larger than the ~16s the
      # actual scan itself takes once the data is present. Weekly key so
      # the cache still refreshes regularly rather than going stale
      # indefinitely.
      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-${{ steps.date.outputs.week }}
          restore-keys: dependency-check-data-

      # failBuildOnCVSS=9 (backend/pom.xml) means this step's own exit code
      # is the real gate - a genuine, un-suppressed Critical finding fails
      # the job. Suppressions are reviewed individually in
      # dependency-check-suppressions.xml, never blanket - see that file
      # for the documented reasoning behind each one.
      - name: Run OWASP dependency-check (aggregate, whole reactor)
        working-directory: netcradus-acis/backend
        run: mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: netcradus-acis/backend/target/dependency-check-report.*
          if-no-files-found: warn

  container-build-scan-push:
    name: Build + scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [backend, frontend, dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: netcradus-acis/frontend/Dockerfile
            context: netcradus-acis
            # Vite inlines VITE_* vars into the static bundle at BUILD
            # time (see frontend/Dockerfile's own comment) - without
            # these, the Dockerfile's ARG defaults apply instead
            # (VITE_KEYCLOAK_URL=http://localhost:8180), which is exactly
            # what happened on this pipeline's first real deploy: the
            # live frontend bundle had localhost:8180 baked in, so every
            # real login attempt failed with a browser-side connection
            # refused trying to reach a Keycloak that doesn't exist in
            # that browser's network. Found via the `verify` job's own
            # real E2E test failing, then confirmed directly by curling
            # the actual deployed JS bundle for the literal string.
            build_args: |
              VITE_KEYCLOAK_URL=https://acis.netcradus.com:8443
              VITE_KEYCLOAK_REALM=acis
              VITE_KEYCLOAK_CLIENT_ID=acis-frontend
          - name: ai-service
            dockerfile: netcradus-acis/ai-service/Dockerfile
            context: netcradus-acis/ai-service
          - name: keycloak
            dockerfile: netcradus-acis/infra/keycloak/Dockerfile
            context: netcradus-acis
          - name: gateway
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-gateway
          - name: alerts
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-alerts
          - name: log-service
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-log-service
          - name: correlation
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-correlation
          - name: ingestion
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-ingestion
          - name: soar
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-soar
          - name: asset-service
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-asset-service
          - name: platform-admin
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-platform-admin
          - name: threat-service
            dockerfile: netcradus-acis/infra/docker/Dockerfile.backend
            context: netcradus-acis
            build_arg: acis-threat-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args || (matrix.build_arg && format('SERVICE={0}', matrix.build_arg)) || '' }}
          push: false
          load: true
          tags: acis/${{ matrix.name }}:${{ github.sha }}

      # Fails the job on any CRITICAL finding with a known fix - matches
      # this project's real, investigated Critical=0 target (see the
      # production readiness report for the small number of findings
      # deliberately accepted with documented, non-blanket justification;
      # those have FixedVersion=none, which --ignore-unfixed correctly
      # leaves un-actionable here rather than blocking every build on an
      # upstream gap this Dockerfile cannot close).
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acis/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan (full report, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acis/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: json
          output: trivy-${{ matrix.name }}.json
          exit-code: "0"

      - name: Publish scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: ignore

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag "acis/${{ matrix.name }}:${{ github.sha }}" "$ECR_REGISTRY/acis/${{ matrix.name }}:${{ github.sha }}"
          # Idempotent: if this exact git-SHA tag already exists in ECR
          # (immutable tags - see infra/terraform/ecr.tf), some other run
          # already pushed the identical commit's image, which is exactly
          # equivalent to this push succeeding. The concurrency group
          # above should prevent this from ever actually happening now,
          # but this is real, cheap defense-in-depth rather than relying
          # on that alone.
          if aws ecr describe-images --region "$AWS_REGION" --repository-name "acis/${{ matrix.name }}" --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "Tag ${{ github.sha }} already present in ECR for ${{ matrix.name }} - treating as already pushed."
          else
            docker push "$ECR_REGISTRY/acis/${{ matrix.name }}:${{ github.sha }}"
          fi

  deploy:
    name: Deploy to AWS production
    runs-on: ubuntu-latest
    needs: [container-build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: netcradus-acis
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate ECR-mode docker-compose.aws.yml
        run: python infra/scripts/generate-aws-compose.py
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}

      # `git archive HEAD` run with CWD inside netcradus-acis/ implicitly
      # scopes to just that subtree (git treats CWD as a pathspec) -
      # matches exactly what the manual deploy-to-aws.sh path already does
      # locally, so the packaged tree's internal layout is identical
      # either way.
      - name: Package config tree (no source needed - images already in ECR)
        run: |
          mkdir -p /tmp/deploy-tree
          git archive HEAD | tar -x -C /tmp/deploy-tree
          cp docker-compose.aws.yml /tmp/deploy-tree/docker-compose.aws.yml
          tar -czf /tmp/repo.tar.gz -C /tmp/deploy-tree .

      - name: Upload deploy artifacts to S3
        run: |
          aws s3 cp /tmp/repo.tar.gz "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/repo.tar.gz" --region "$AWS_REGION"
          aws s3 cp docker-compose.aws.yml "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/docker-compose.aws.yml" --region "$AWS_REGION"
          aws s3 cp infra/scripts/aws-remote-deploy-ecr.sh "s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh" --region "$AWS_REGION"

      - name: Trigger deploy via SSM
        id: trigger
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "acis-cicd-deploy-${{ github.sha }}" \
            --timeout-seconds 3600 \
            --parameters "commands=[\"set -e\", \"aws s3 cp s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh /tmp/aws-remote-deploy-ecr.sh --region $AWS_REGION\", \"chmod +x /tmp/aws-remote-deploy-ecr.sh\", \"S3_BUCKET=${{ vars.S3_DEPLOY_BUCKET }} SECRET_ARN='${{ vars.SECRETS_MANAGER_SECRET_ARN }}' RDS_ADDRESS=${{ vars.RDS_ADDRESS }} REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=${{ github.sha }} /tmp/aws-remote-deploy-ecr.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy triggered: $COMMAND_ID"

      - name: Wait for deploy to complete
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "${{ steps.trigger.outputs.command_id }}" \
              --instance-id "${{ vars.APP_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Deploy status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed"
              exit 1
            fi
            sleep 30
          done
          echo "Deploy did not complete within the wait window"
          exit 1

      - name: Show deploy output
        if: always()
        run: |
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "${{ steps.trigger.outputs.command_id }}" \
            --instance-id "${{ vars.APP_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text | tail -60
          echo "--- stderr ---"
          aws ssm get-command-invocation --region "$AWS_REGION" \
            --command-id "${{ steps.trigger.outputs.command_id }}" \
            --instance-id "${{ vars.APP_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text | tail -60

  verify:
    name: Health check + smoke test + E2E
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ALB target groups to report healthy
        run: |
          for tg in "${{ vars.ALB_FRONTEND_TG_ARN }}" "${{ vars.ALB_KEYCLOAK_TG_ARN }}" "${{ vars.ALB_GRAFANA_TG_ARN }}"; do
            STATE="unknown"
            for i in $(seq 1 20); do
              STATE=$(aws elbv2 describe-target-health --region "$AWS_REGION" --target-group-arn "$tg" --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
              echo "$tg -> $STATE"
              [ "$STATE" = "healthy" ] && break
              sleep 15
            done
            if [ "$STATE" != "healthy" ]; then
              echo "Target group never became healthy: $tg"
              exit 1
            fi
          done

      - name: Production smoke test (DNS, HTTPS, redirect, admin console blocked)
        run: |
          set -e
          echo "HTTP -> HTTPS redirect:"
          curl -sI --max-time 10 http://acis.netcradus.com/ | grep -i "^HTTP/" | grep -q "301"
          echo "HTTPS real response:"
          curl -sf --max-time 10 https://acis.netcradus.com/ -o /dev/null
          echo "Keycloak admin console still blocked:"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://acis.netcradus.com:8443/admin/)
          if [ "$CODE" != "403" ]; then
            echo "Admin console not blocked (got $CODE)"
            exit 1
          fi
          echo "Keycloak realm/OIDC reachable:"
          curl -sf --max-time 10 https://acis.netcradus.com:8443/realms/acis/.well-known/openid-configuration -o /dev/null
          echo "All smoke checks passed."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: netcradus-acis/frontend/package-lock.json

      - name: Install Playwright
        working-directory: netcradus-acis/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Real production E2E (login, invalid login, RBAC)
        working-directory: netcradus-acis/frontend
        env:
          SMOKE_ADMIN_PASS: ${{ secrets.SMOKE_TEST_ADMIN_PASSWORD }}
          SMOKE_ANALYST_PASS: ${{ secrets.SMOKE_TEST_ANALYST_PASSWORD }}
        run: npx playwright test --config=e2e-prod/playwright.config.cjs --reporter=line

  rollback-on-failure:
    name: Automatic rollback
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # deploy-history.log's second-to-last line is the previous
      # known-good deploy (the last line is the one `verify` just failed
      # on). `cut` instead of `awk` deliberately - a real SSM inline
      # command earlier in this project's history broke from exactly this
      # kind of nested `awk '{print $N}'` escaping (bash -> JSON ->
      # awk, three layers deep) - `cut` needs none of that.
      - name: Read previous known-good image tag
        id: prev
        run: |
          FETCH_CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["tail -n 2 /opt/acis/deploy-history.log | head -n 1 | cut -d\" \" -f3"]' \
            --query "Command.CommandId" --output text)
          sleep 10
          TAG=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$FETCH_CMD_ID" --instance-id "${{ vars.APP_INSTANCE_ID }}" --query "StandardOutputContent" --output text | tr -d '[:space:]')
          echo "previous_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rolling back to: $TAG"

      - name: Redeploy previous tag (pull-based, no rebuild)
        run: |
          # Real bug found and fixed: this step used to be fire-and-forget
          # (send-command, capture the command ID, never check whether it
          # actually succeeded). On a live run, the rollback silently
          # failed - `docker compose pull` couldn't find the target tag
          # in ECR (it predated this CI/CD pipeline's ECR-push path,
          # having only ever been built directly on the instance by the
          # older manual deploy path) - and the workflow still reported
          # "Automatic rollback" green because the SSM command was merely
          # *sent* successfully, not because the rollback itself worked.
          # Now actually waits for and checks the real outcome.
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "acis-cicd-rollback" \
            --timeout-seconds 1800 \
            --parameters "commands=[\"set -e\", \"aws s3 cp s3://${{ vars.S3_DEPLOY_BUCKET }}/deploys/aws-remote-deploy-ecr.sh /tmp/aws-remote-deploy-ecr.sh --region $AWS_REGION\", \"chmod +x /tmp/aws-remote-deploy-ecr.sh\", \"S3_BUCKET=${{ vars.S3_DEPLOY_BUCKET }} SECRET_ARN='${{ vars.SECRETS_MANAGER_SECRET_ARN }}' RDS_ADDRESS=${{ vars.RDS_ADDRESS }} REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=${{ steps.prev.outputs.previous_tag }} /tmp/aws-remote-deploy-ecr.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "Rollback command: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" --instance-id "${{ vars.APP_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Rollback status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Rollback to ${{ steps.prev.outputs.previous_tag }} FAILED - production is left running whatever the failed deploy left behind. Manual intervention required."
              aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "${{ vars.APP_INSTANCE_ID }}" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 30
          done
          echo "::error::Rollback did not complete within the wait window"
          exit 1
